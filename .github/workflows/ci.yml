name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm run build:demo
      - name: Build no subcaminho do portfólio
        run: npm run build
        env:
          VITE_BASE_PATH: /workout-tracker/
      - name: Validar a candidata, incluindo PWA e mídias
        run: npm run test:rc
        env:
          VITE_BASE_PATH: /workout-tracker/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
